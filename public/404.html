<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Juan Mora - Página no encontrada</title>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-background text-foreground min-h-screen flex flex-col">
    <main
      class="flex-grow flex items-center justify-center relative overflow-hidden"
    >
      <div
        class="absolute inset-0 bg-gradient-to-tr from-primary/10 to-blue-500/10 z-0"
      ></div>

      <div
        class="absolute top-20 left-10 w-32 h-32 bg-blue-500/20 rounded-full blur-3xl animate-pulse-glow"
      ></div>
      <div
        class="absolute bottom-20 right-10 w-40 h-40 bg-purple-500/20 rounded-full blur-3xl animate-pulse-glow animation-delay-1000"
      ></div>
      <div
        class="absolute top-1/3 right-1/4 w-24 h-24 bg-primary/20 rounded-full blur-3xl animate-pulse-glow animation-delay-2000"
      ></div>

      <div class="container max-w-5xl mx-auto z-10 text-center px-4 py-10">
        <h1 class="text-5xl md:text-6xl font-bold gradient-text mb-6">404</h1>
        <h2 class="text-2xl md:text-3xl font-semibold mb-4">Page not found</h2>
        <p class="text-muted-foreground mb-8 max-w-2xl mx-auto">
          We're sorry, the page you're looking for doesn't exist.
        </p>
        <a
          href="/"
          class="inline-block px-6 py-3 rounded-lg bg-primary text-primary-foreground font-medium hover:bg-primary/90 transition-colors"
        >
          Go back home
        </a>
      </div>
    </main>

    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
